name = "fortran_shapefuncs"
version = "0.1.0"
license = "MIT"
author = "Will Klausler"
copyright = "Copyright 2025-2026, Will Klausler"
description = "Finite element shape functions, including mapped infinite elements"
categories = ["numerical methods"]
keywords = ["shape-functions", "finite-element", "infinite-element", "interpolation"]
homepage = "https://github.com/willklausler/fortran_shapefuncs"

[dependencies]
fortran_cubatures = { git = "https://github.com/willklausler/fortran_cubatures" }

[features]
debug.flags = "-g -Wall"

debug.gfortran.flags = "-fbacktrace -fcheck=all -Wextra -Wpedantic -Wuninitialized -Wmaybe-uninitialized -Wimplicit-interface -Wimplicit-procedure -Warray-temporaries -Wrealloc-lhs -finit-real=snan -finit-integer=-2147483648 -finit-logical=true -fstack-protector-all"
debug.gfortran.linux.flags = "-fsanitize=address,undefined"

debug.ifx.flags = "-check all -warn all -traceback -fpe0 -init=snan,arrays -ftrapuv -fp-stack-check -diag-error-limit 10"
debug.ifx.linux.flags = "-fsanitize=address,undefined"

debug.nvfortran.flags = "-Minform=inform -Mbounds -Mchkptr -Mchkstk -Mstandard -Ktrap=fp -traceback"

release.flags = "-O3"
release.gfortran.flags = "-fbacktrace -march=native -funroll-loops"
release.gfortran.linux.flags = "-flto"   # MinGW ar drops LTO objects from the archive
release.ifx.flags = "-xHost -unroll"

release.nvfortran.flags = "-Mrecursive -fast"

[profiles]
debug = ["debug"]
release = ["release"]

[install]
library = true
